<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>AI Chat - Groq Fast</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
            background: #0b0e11; 
            color: white; 
            margin: 0; 
            display: flex; 
            height: 100vh;
            height: 100dvh; 
            overflow: hidden; 
        }
        .sidebar { width: 260px; background: #18191a; border-right: 1px solid #333; display: flex; flex-direction: column; padding: 10px; transition: 0.3s; }
        .new-btn { background: #0084ff; color: white; border: none; padding: 12px; border-radius: 8px; cursor: pointer; font-weight: bold; margin-bottom: 20px; }
        .history-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 5px; }
        .history-item { padding: 10px; background: #242526; border-radius: 5px; cursor: pointer; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .history-item.active { border: 1px solid #0084ff; background: #3a3b3c; }
        .settings-btn { background: none; border: 1px solid #444; color: #888; padding: 5px; cursor: pointer; font-size: 11px; margin-top: 5px; border-radius: 4px; }
        .key-label { font-size: 10px; color: #666; text-align: center; margin-top: 6px; }

        .main { flex: 1; display: flex; flex-direction: column; background: #0b0e11; position: relative; }
        #chat-box { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; padding-bottom: 90px; }
        .bubble { padding: 12px 16px; border-radius: 18px; max-width: 85%; line-height: 1.5; font-size: 15px; word-break: break-word; white-space: pre-wrap; }
        .user { align-self: flex-end; background: #0084ff; border-bottom-right-radius: 2px; }
        .ai { align-self: flex-start; background: #242526; border-bottom-left-radius: 2px; border: 1px solid #333; }
        .ai.error { border-color: #ff4d4f; color: #ff8787; background: #2a1416; }
        .ai.loading { color: #888; font-style: italic; }

        .input-area { 
            position: absolute; 
            bottom: 0; 
            width: 100%; 
            padding: 15px; 
            padding-bottom: calc(15px + env(safe-area-inset-bottom)); 
            background: #18191a; 
            display: flex; 
            gap: 10px; 
            border-top: 1px solid #333; 
        }
        input { flex: 1; padding: 12px 18px; border: none; border-radius: 25px; background: #3a3b3c; color: white; outline: none; font-size: 16px !important; }
        button#send { background: #0084ff; color: white; border: none; padding: 0 20px; border-radius: 25px; cursor: pointer; font-weight: bold; }
        button#send:disabled { background: #555; cursor: not-allowed; }

        @media (max-width: 600px) {
            .sidebar { width: 60px; padding: 5px; }
            .sidebar .new-btn, .sidebar .history-item, .key-label { font-size: 10px; padding: 5px; text-align: center; }
            .new-btn { font-size: 20px !important; }
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <button class="new-btn" onclick="createNewChat()" title="Chat Baru">+</button>
        <div class="history-list" id="history-list"></div>
        <button class="settings-btn" onclick="resetKey()">Reset Key</button>
        <div class="key-label" id="key-label"></div>
    </div>

    <div class="main">
        <div id="chat-box"></div>
        <div class="input-area">
            <input type="text" id="user-input" placeholder="Tanya AI..." onkeypress="if(event.key === 'Enter') send()">
            <button id="send" onclick="send()">➤</button>
        </div>
    </div>

    <script>
        // MODEL AKTIF GROQ (llama-3.1-8b-instant sudah dipensiunkan Agustus 2026)
        const MODEL = "openai/gpt-oss-20b";

        let API_KEY = localStorage.getItem('groq_api_key');

        function ensureKey() {
            if (!API_KEY) {
                API_KEY = prompt("Masukkan Groq API Key kamu (gsk_...):");
                if (API_KEY) {
                    localStorage.setItem('groq_api_key', API_KEY);
                }
            }
            updateKeyLabel();
        }

        function updateKeyLabel() {
            const el = document.getElementById('key-label');
            if (!el) return;
            el.innerText = API_KEY ? ("Key: " + API_KEY.slice(0, 6) + "...") : "Belum ada Key";
        }

        function resetKey() {
            localStorage.clear();
            location.reload();
        }

        let allChats = JSON.parse(localStorage.getItem('all_chats')) || {};
        let currentChatId = localStorage.getItem('current_chat_id') || null;

        function save() {
            localStorage.setItem('all_chats', JSON.stringify(allChats));
            localStorage.setItem('current_chat_id', currentChatId);
            renderSidebar();
        }

        function renderSidebar() {
            const list = document.getElementById('history-list');
            if (!list) return;
            list.innerHTML = '';
            Object.keys(allChats).sort().reverse().forEach(id => {
                const item = document.createElement('div');
                item.className = `history-item ${id === currentChatId ? 'active' : ''}`;
                item.innerText = allChats[id].title || "Chat Baru";
                item.onclick = () => loadChat(id);
                list.appendChild(item);
            });
        }

        function renderMessages() {
            const box = document.getElementById('chat-box');
            if (!box) return;
            box.innerHTML = '';
            if (currentChatId && allChats[currentChatId]) {
                allChats[currentChatId].messages.forEach(m => {
                    const div = document.createElement('div');
                    div.className = `bubble ${m.role === 'user' ? 'user' : 'ai'}`;
                    div.innerText = m.content;
                    box.appendChild(div);
                });
            }
            box.scrollTop = box.scrollHeight;
        }

        function createNewChat() {
            currentChatId = 'chat_' + Date.now();
            allChats[currentChatId] = { title: "Chat Baru", messages: [] };
            save();
            renderMessages();
            document.getElementById('user-input').value = '';
        }

        function loadChat(id) {
            currentChatId = id;
            save();
            renderMessages();
        }

        function addBubble(role, text, extraClass) {
            const box = document.getElementById('chat-box');
            const div = document.createElement('div');
            div.className = `bubble ${role === 'user' ? 'user' : 'ai'} ${extraClass || ''}`;
            div.innerText = text;
            box.appendChild(div);
            box.scrollTop = box.scrollHeight;
            return div;
        }

        async function send() {
            ensureKey();
            if (!API_KEY) {
                addBubble('ai', 'Kamu belum masukkan API Key. Klik "Reset Key" lalu isi lagi.', 'error');
                return;
            }

            const inp = document.getElementById('user-input');
            const btn = document.getElementById('send');
            const text = inp.value.trim();
            if (!text) return;

            if (!currentChatId || !allChats[currentChatId]) {
                createNewChat();
            }

            if (allChats[currentChatId].messages.length === 0) {
                allChats[currentChatId].title = text.substring(0, 15);
            }

            allChats[currentChatId].messages.push({ role: "user", content: text });
            inp.value = '';
            inp.disabled = true;
            btn.disabled = true;
            renderMessages();

            const loadingBubble = addBubble('ai', 'Mengetik...', 'loading');

            const messagesPayload = [
                {
                    role: "system",
                    content: "please response with fun but keep it short like real conversation of human, target place is dating app"
                },
                ...allChats[currentChatId].messages
            ];

            try {
                const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Authorization": "Bearer " + API_KEY,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        model: MODEL,
                        messages: messagesPayload,
                        stream: false
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    const msg = data?.error?.message || JSON.stringify(data);
                    throw new Error(`HTTP ${response.status}: ${msg}`);
                }

                const reply = data.choices?.[0]?.message?.content;
                if (!reply) {
                    throw new Error("Respon kosong / format tidak dikenali: " + JSON.stringify(data));
                }

                loadingBubble.remove();
                addBubble('ai', reply);
                allChats[currentChatId].messages.push({ role: "assistant", content: reply });
                save();

            } catch (e) {
                loadingBubble.remove();
                addBubble('ai', '⚠️ ' + e.message, 'error');
                console.error("Groq error:", e);
            } finally {
                inp.disabled = false;
                btn.disabled = false;
                inp.focus();
            }
        }

        ensureKey();
        if (!currentChatId || !allChats[currentChatId]) {
            createNewChat();
        } else {
            renderSidebar();
            renderMessages();
        }
    </script>
</body>
</html>
