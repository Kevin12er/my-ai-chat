<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>AI Chat - Private Key Mode</title>
    <style>
        * { 
            box-sizing: border-box; 
            touch-action: manipulation;
        }
        
        html, body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
            background: #0b0e11; 
            color: white; 
            margin: 0; 
            padding: 0;
            width: 100%;
            height: 100%;
            height: 100dvh; 
            overflow: hidden; 
            position: fixed; 
        }

        body {
            display: flex;
        }
        
        /* SIDEBAR */
        .sidebar { 
            width: 260px; 
            background: #18191a; 
            border-right: 1px solid #333; 
            display: flex; 
            flex-direction: column; 
            padding: 10px; 
            transition: 0.3s; 
        }
        .new-btn { 
            background: #0084ff; 
            color: white; 
            border: none; 
            padding: 12px; 
            border-radius: 8px; 
            cursor: pointer; 
            font-weight: bold; 
            margin-bottom: 20px; 
        }
        .history-list { 
            flex: 1; 
            overflow-y: auto; 
            display: flex; 
            flex-direction: column; 
            gap: 5px; 
        }
        .history-item { 
            padding: 10px; 
            background: #242526; 
            border-radius: 5px; 
            cursor: pointer; 
            font-size: 14px; 
            white-space: nowrap; 
            overflow: hidden; 
            text-overflow: ellipsis; 
        }
        .history-item.active { 
            border: 1px solid #0084ff; 
            background: #3a3b3c; 
        }
        .settings-btn { 
            background: none; 
            border: 1px solid #444; 
            color: #888; 
            padding: 8px; 
            cursor: pointer; 
            font-size: 11px; 
            margin-top: 5px; 
            border-radius: 4px; 
        }

        /* MAIN CHAT */
        .main { 
            flex: 1; 
            display: flex; 
            flex-direction: column; 
            background: #0b0e11; 
            position: relative; 
            height: 100%;
        }
        #chat-box { 
            flex: 1; 
            overflow-y: auto; 
            padding: 20px; 
            display: flex; 
            flex-direction: column; 
            gap: 15px; 
            padding-bottom: 90px; 
            -webkit-overflow-scrolling: touch; 
        }
        .bubble { 
            padding: 12px 16px; 
            border-radius: 18px; 
            max-width: 85%; 
            line-height: 1.5; 
            font-size: 15px; 
            word-break: break-word;
        }
        .user { 
            align-self: flex-end; 
            background: #0084ff; 
            border-bottom-right-radius: 2px; 
        }
        .ai { 
            align-self: flex-start; 
            background: #242526; 
            border-bottom-left-radius: 2px; 
            border: 1px solid #333; 
        }

        /* INPUT AREA FIX FOR iOS SAFE AREA */
        .input-area { 
            position: absolute; 
            bottom: 0; 
            left: 0;
            width: 100%; 
            padding: 12px 15px; 
            padding-bottom: calc(12px + env(safe-area-inset-bottom)); 
            background: #18191a; 
            display: flex; 
            gap: 10px; 
            border-top: 1px solid #333; 
            box-sizing: border-box;
            z-index: 10;
        }
        input { 
            flex: 1; 
            padding: 12px 18px; 
            border: none; 
            border-radius: 25px; 
            background: #3a3b3c; 
            color: white; 
            outline: none; 
            font-size: 16px !important; 
        }
        button#send { 
            background: #0084ff; 
            color: white; 
            border: none; 
            padding: 0 20px; 
            border-radius: 25px; 
            cursor: pointer; 
            font-weight: bold; 
            font-size: 16px;
        }

        /* RESPONSIVE MOBILE */
        @media (max-width: 600px) {
            .sidebar { 
                width: 80px; 
                padding: 5px; 
            }
            .sidebar .history-item { 
                font-size: 10px;
                padding: 8px 4px;
                text-align: center;
            }
            .new-btn { 
                font-size: 20px !important; 
                padding: 8px;
                margin-bottom: 10px;
            }
            .settings-btn {
                font-size: 8px;
                padding: 4px 2px;
            }
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <button class="new-btn" onclick="createNewChat()" title="Chat Baru">+</button>
        <div class="history-list" id="history-list"></div>
        <button class="settings-btn" onclick="resetKey()">Reset Key</button>
    </div>

    <div class="main">
        <div id="chat-box"></div>
        <div class="input-area">
            <input type="text" id="user-input" placeholder="Tanya sesuatu..." onkeypress="if(event.key === 'Enter') send()">
            <button id="send" onclick="send()">➤</button>
        </div>
    </div>

    <script>
        // --- SISTEM KEAMANAN KEY ---
        let API_KEY = localStorage.getItem('groq_api_key');

        if (!API_KEY) {
            API_KEY = prompt("Website ini Public. Demi keamanan, masukkan API Key Groq kamu di sini (hanya disimpan di browsermu):");
            if (API_KEY) {
                localStorage.setItem('groq_api_key', API_KEY);
            } else {
                alert("Tanpa Key, AI tidak bisa menjawab.");
            }
        }

        function resetKey() {
            localStorage.removeItem('groq_api_key');
            location.reload();
        }

        // --- SISTEM CHAT ---
        const MODEL = "llama-3.1-8b-instant";
        let allChats = JSON.parse(localStorage.getItem('all_chats')) || {};
        let currentChatId = localStorage.getItem('current_chat_id') || null;

        function save() {
            localStorage.setItem('all_chats', JSON.stringify(allChats));
            localStorage.setItem('current_chat_id', currentChatId);
            renderSidebar();
        }

        function renderSidebar() {
            const list = document.getElementById('history-list');
            list.innerHTML = '';
            Object.keys(allChats).sort().reverse().forEach(id => {
                const item = document.createElement('div');
                item.className = `history-item ${id === currentChatId ? 'active' : ''}`;
                item.innerText = allChats[id].title || "Chat Baru";
                item.onclick = () => loadChat(id);
                list.appendChild(item);
            });
        }

        function renderMessages() {
            const box = document.getElementById('chat-box');
            box.innerHTML = '';
            if (currentChatId && allChats[currentChatId]) {
                allChats[currentChatId].messages.forEach(m => {
                    const div = document.createElement('div');
                    div.className = `bubble ${m.role === 'user' ? 'user' : 'ai'}`;
                    div.innerText = m.content;
                    box.appendChild(div);
                });
            }
            box.scrollTop = box.scrollHeight;
        }

        // FUNGSI CHAT BARU DIBERSIHKAN SAMA SEPERTI KODE LAMA
        function createNewChat() {
            currentChatId = 'chat_' + Date.now();
            allChats[currentChatId] = { title: "Chat Baru", messages: [] };
            save();
            renderMessages(); // Langsung mengosongkan layar chat
            document.getElementById('user-input').focus();
        }

        function loadChat(id) {
            currentChatId = id;
            save();
            renderMessages();
        }

        async function send() {
            const inp = document.getElementById('user-input');
            const text = inp.value.trim();
            if (!text || !API_KEY) return;

            if (!currentChatId || !allChats[currentChatId]) {
                createNewChat();
            }

            // Jika pesan pertama di chat baru, perbarui judulnya
            if (allChats[currentChatId].messages.length === 0) {
                allChats[currentChatId].title = text.substring(0, 15);
            }

            allChats[currentChatId].messages.push({ role: "user", content: text });
            inp.value = '';
            renderMessages();

            try {
                const r = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                    method: "POST",
                    headers: { 
                        "Authorization": `Bearer ${API_KEY}`, 
                        "Content-Type": "application/json" 
                    },
                    body: JSON.stringify({ 
                        model: MODEL, 
                        messages: allChats[currentChatId].messages,
                        max_tokens: 1024 
                    })
                });
                
                const d = await r.json();
                if (d.error) throw new Error(d.error.message);
                
                const reply = d.choices[0].message.content;
                allChats[currentChatId].messages.push({ role: "assistant", content: reply });
                save();
                renderMessages();
            } catch (e) {
                alert("Error: " + e.message);
            }
        }

        // Jalankan saat pertama kali dibuka
        if (!currentChatId || !allChats[currentChatId]) {
            createNewChat();
        } else {
            renderSidebar();
            renderMessages();
        }
    </script>
</body>
</html>
